name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, notekit, linux, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          tags: notekit-api:latest
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache-api
          cache-to: type=local,dest=/tmp/.buildx-cache-api-new,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          tags: notekit-web:latest
          load: true
          build-args: |
            VITE_API_URL=https://api.notekit.online
          cache-from: type=local,src=/tmp/.buildx-cache-web
          cache-to: type=local,dest=/tmp/.buildx-cache-web-new,mode=max

      - name: Build landing image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/landing/Dockerfile
          tags: notekit-landing:latest
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache-landing
          cache-to: type=local,dest=/tmp/.buildx-cache-landing-new,mode=max

      - name: Rotate build cache
        run: |
          rm -rf /tmp/.buildx-cache-api /tmp/.buildx-cache-web /tmp/.buildx-cache-landing
          mv /tmp/.buildx-cache-api-new /tmp/.buildx-cache-api || true
          mv /tmp/.buildx-cache-web-new /tmp/.buildx-cache-web || true
          mv /tmp/.buildx-cache-landing-new /tmp/.buildx-cache-landing || true

      # Secrets now come from HashiCorp Vault (secret/notekit) via AppRole
      # (repo secrets VAULT_ROLE_ID/VAULT_SECRET_ID). Rendered to .env.notekit,
      # which docker compose reads via --env-file. Runs right before Deploy so a
      # Vault failure aborts before the running stack is touched.
      - name: Render secrets from Vault
        env:
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
        run: |
          set -euo pipefail
          TOKEN=$(docker exec -e VAULT_ADDR=http://127.0.0.1:8200 vault \
            vault write -field=token auth/approle/login role_id="$VAULT_ROLE_ID" secret_id="$VAULT_SECRET_ID")
          docker exec -e VAULT_ADDR=http://127.0.0.1:8200 -e VAULT_TOKEN="$TOKEN" vault \
            vault kv get -format=json secret/notekit \
            | python3 -c "import sys,json;d=json.load(sys.stdin)['data']['data'];[print(f'{k}={v}') for k,v in sorted(d.items())]" > .env.notekit
          echo "Rendered $(grep -c = .env.notekit) vars into .env.notekit from Vault"

      - name: Deploy
        run: |
          docker compose --env-file .env.notekit -f docker-compose.notekit.yml up -d --remove-orphans
          rm -f .env.notekit
