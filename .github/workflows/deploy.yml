name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, notekit, linux, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          tags: notekit-api:latest
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache-api
          cache-to: type=local,dest=/tmp/.buildx-cache-api-new,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          tags: notekit-web:latest
          load: true
          build-args: |
            VITE_API_URL=https://api.notekit.online
          cache-from: type=local,src=/tmp/.buildx-cache-web
          cache-to: type=local,dest=/tmp/.buildx-cache-web-new,mode=max

      - name: Build landing image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/landing/Dockerfile
          tags: notekit-landing:latest
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache-landing
          cache-to: type=local,dest=/tmp/.buildx-cache-landing-new,mode=max

      - name: Build backoffice image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backoffice/Dockerfile
          tags: notekit-backoffice:latest
          load: true
          build-args: |
            VITE_API_URL=https://api.notekit.online
          cache-from: type=local,src=/tmp/.buildx-cache-backoffice
          cache-to: type=local,dest=/tmp/.buildx-cache-backoffice-new,mode=max

      - name: Rotate build cache
        run: |
          rm -rf /tmp/.buildx-cache-api /tmp/.buildx-cache-web /tmp/.buildx-cache-landing /tmp/.buildx-cache-backoffice
          mv /tmp/.buildx-cache-api-new /tmp/.buildx-cache-api || true
          mv /tmp/.buildx-cache-web-new /tmp/.buildx-cache-web || true
          mv /tmp/.buildx-cache-landing-new /tmp/.buildx-cache-landing || true
          mv /tmp/.buildx-cache-backoffice-new /tmp/.buildx-cache-backoffice || true

      # Secrets come from HashiCorp Vault (secret/notekit) via AppRole (repo
      # secrets VAULT_ROLE_ID/VAULT_SECRET_ID). The shared host helper renders
      # every key into $GITHUB_ENV — multi-line-safe (EC private keys) and masks
      # values in the log. Deploy then reads them via normal compose ${VAR}
      # interpolation. Runs right before Deploy so a Vault failure aborts before
      # the running stack is touched.
      - name: Render secrets from Vault
        env:
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
        run: /opt/vault-ci/render-github-env.sh secret/notekit

      - name: Deploy
        run: docker compose -f docker-compose.notekit.yml up -d --remove-orphans
